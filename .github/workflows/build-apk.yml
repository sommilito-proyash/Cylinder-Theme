
name: Build Cylinder Radar Launcher APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'CylinderRadarLauncher-Android-Source.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          test -f CylinderRadarLauncher-Android-Source.zip
          unzip -q CylinderRadarLauncher-Android-Source.zip -d extracted
          test -f extracted/CylinderRadarLauncher-Android/settings.gradle

      - name: Build debug APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.9'
          build-root-directory: extracted/CylinderRadarLauncher-Android
          arguments: assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CylinderRadarLauncher-debug-APK
          path: extracted/CylinderRadarLauncher-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
